# fly.toml app configuration file generated for tanstarter on 2025-03-09T18:28:02-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tanstarter'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[deploy]
  # Applies pending database migrations once per deploy, in a temporary Machine
  # running the new image with the app's secrets, before any app Machine is
  # updated. A non-zero exit aborts the deploy and the current release keeps
  # serving. `bun run build` writes this bundle. Strategy stays rolling (the
  # default): bluegreen needs a health check. See .agents/database.md.
  release_command = "bun .output/migrate/migrate.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
