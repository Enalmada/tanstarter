name: Dependency Audit

# Fails on high/critical advisories in production dependencies, or critical ones
# in any dependency (bun audit reads bun.lock; no install needed). Ported from
# UseFrank/frank#41.
#
# Runs on every pull request (the audit takes seconds, and a workflow-level
# `paths:` filter would stop it being a required check; see .agents/security.md)
# and weekly, to catch advisories published after a dependency was merged.
on:
  pull_request:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - run: bun run audit:deps
