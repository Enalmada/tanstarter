name: Playwright

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: true

      - name: Install Playwright Chrome
        run: bunx playwright install chromium --with-deps

      - name: Copy env file
        run: cp .env.example .env

      - name: Configure hosts file
        run: |
          echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts

      - name: Run Docker Compose
        run: |
          # --wait blocks until services with healthchecks (both postgres) are healthy
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
        env:
          DATABASE_URL: "postgres://postgres:postgres@db.localtest.me:5434/tanstarter"

      - name: Run database migrations
        run: |
          echo "Running migrations with proxy configuration..."
          bun run drizzle:migrate
        env:
          DATABASE_URL: "postgres://postgres:postgres@db.localtest.me:5434/tanstarter"
          NODE_ENV: development
          DB_PROXY_PORT: "4444"
          DB_RETRY_INTERVAL: "2000"
          DB_MAX_RETRIES: "15"
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          APP_ENV: development

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          CI: true
          NODE_ENV: development
          DATABASE_URL: "postgres://postgres:postgres@db.localtest.me:5434/tanstarter"
          DB_PROXY_PORT: "4444"
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright/report/
          retention-days: 2

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots
          path: playwright/screenshots/
          retention-days: 2
