name: Secret Scan

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pinned release, verified against its published sha256 (checksums.txt)
      - name: Install Betterleaks
        env:
          VERSION: 1.8.1
          SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
        run: |
          file="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/$file"
          echo "$SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A scanner that silently finds nothing looks the same as a clean repo, so
      # prove it still fails on a planted token (built at runtime so this file
      # holds no token-shaped string) in a throwaway repository. It runs through
      # scripts/scan-secrets.sh, the same wrapper as the real scan, so a broken
      # wrapper or range handling fails here too.
      - name: Prove the scanner catches a planted secret
        run: |
          probe="$RUNNER_TEMP/secret-probe"
          rm -rf "$probe" && mkdir "$probe" && cd "$probe"
          git init -q .
          git -c user.email=ci@example.com -c user.name=ci commit -q --allow-empty -m base
          printf 'token = "ghp_%s"\n' "aB3xK9mQ2vL7nR5tY8wZ1cD4fG6hJ0pS2uXe" > leak.txt
          git add leak.txt
          git -c user.email=ci@example.com -c user.name=ci commit -qm probe
          # A distinct exit code for "found a leak": any other non-zero status
          # (a crash, a bad flag) must not read as the scanner working.
          status=0
          BETTERLEAKS_EXIT_CODE=42 bash "$GITHUB_WORKSPACE/scripts/scan-secrets.sh" "HEAD~1..HEAD" > "$RUNNER_TEMP/probe.log" 2>&1 || status=$?
          if [ "$status" -ne 42 ]; then
            cat "$RUNNER_TEMP/probe.log"
            echo "::error::The secret scan exited $status on a planted token (expected 42), so its scans cannot be trusted"
            exit 1
          fi

      # Only the commits this PR adds. The repo is public, so there's no
      # history baseline: anything already pushed is already exposed.
      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/scan-secrets.sh "$BASE_SHA..$HEAD_SHA"
