name: Static Analysis

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-analysis:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Unused files, exports and dependencies (knip.jsonc)
      - name: knip
        run: bun run knip

      # Relative links in Markdown docs resolve to real files
      - name: Doc links
        run: bun run check:doc-links

      # Every spec under src/e2e belongs to a Playwright project (no browsers needed)
      - name: E2E spec coverage
        run: bun run check:e2e-specs

      # Lingui catalogs are extracted and every locale is translated
      - name: i18n catalogs
        run: bun run i18n:check
