name: Static Analysis

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-analysis:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Unused files, exports and dependencies (knip.jsonc)
      - name: knip
        run: bun run knip

      # Every spec under src/e2e belongs to a Playwright project (no browsers needed)
      - name: E2E spec coverage
        run: bun run check:e2e-specs

      # Lingui catalogs are extracted and every locale is translated
      - name: i18n catalogs
        run: bun run i18n:check
