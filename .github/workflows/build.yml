name: Build

# Production build gate. Every other job runs dev-mode tooling (tsc, vitest,
# `vite dev` under Playwright); until this job existed the only production
# compile was the Fly deploy on `main`, so a broken `vite build` surfaced after
# merge. This mirrors the Dockerfile's builder stage (`NODE_ENV=production bun
# run build`, no .env, no secrets).
#
# `build:prod` is intentionally NOT used: it also runs `drizzle:migrate`, which
# needs a live database, and production (Dockerfile) only runs `bun run build`.

on:
  pull_request:
  push:
    branches-ignore:
      - main

# Separate groups for push vs pull_request runs so one never cancels the other;
# a newer commit on the same branch/PR cancels the older run of the same kind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Bun from packageManager (as the Dockerfile), and the Dockerfile's
      # install flags (`--ignore-scripts`).
      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      # The build needs no app env vars today (env.config.ts is validated at
      # runtime, not at build time), matching the Docker build, which has none.
      # The build script runs vite under Bun (`bun --bun`), as in the Docker
      # image (which has no Node), even though the runner has Node installed.
      - name: Production build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Check build output
        run: test -f .output/server/index.mjs

      # No database driver, ORM or server SDK in the client bundle (server-only markers
      # fail the build on a static import; this checks the output too)
      - name: Check client bundle for server code
        run: bun run check-client-leaks
