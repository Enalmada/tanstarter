name: 'Storybook Tests'

# The path filter lives in the `changes` job, not on the trigger: a workflow
# skipped by `paths:` reports no check at all, so it could never be a required
# check. A job skipped by `if:` reports as skipped, which branch protection
# accepts, and so does a job skipped because the job it needs failed. Require
# the `storybook` job, not `changes` or `test`: it fails when the filter
# fails, and passes when the filter skips the tests on purpose.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for changes that affect Storybook
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Storybook's builder loads the root Vite config (plugins, aliases, define)
          pattern='^(src/|\.storybook/|vitest\.config\.ts$|vite\.config\.ts$|tsconfig\.json$|lingui\.config\.js$|scripts/vite-service-worker\.ts$|postcss\.config\.ts$|bunfig\.toml$|\.nvmrc$|package\.json$|bun\.lock$|\.github/workflows/storybook-tests\.yml$)'
          # Into a variable first: with pipefail, grep -q exiting early can SIGPIPE
          # git diff and make a match look like no match.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "storybook=true" >> "$GITHUB_OUTPUT"
          else
            echo "storybook=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Storybook-relevant files changed; skipping"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache turbo build setup
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The dev server and test-storybook never run a production bundle, so
      # a broken static build only shows up here.
      - name: Build static Storybook
        timeout-minutes: 10
        run: bun run build-storybook --quiet

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Start Storybook and run tests
        timeout-minutes: 10
        run: bunx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
          "bun storybook --ci --quiet" \
          "bunx wait-on http://localhost:6006/iframe.html && bun test-storybook"

  storybook:
    needs: [changes, test]
    # always(), not !cancelled(): a cancelled run must fail this check, not skip it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a working filter, and passing tests when it asked for them
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.storybook }}
          TEST: ${{ needs.test.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::changes job: $CHANGES"; exit 1; }
          if [ "$WANTED" = true ] && [ "$TEST" != success ]; then
            echo "::error::test job: $TEST"
            exit 1
          fi
