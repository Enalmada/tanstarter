name: 'Storybook Tests'

on:
  pull_request:
    paths:
      - 'src/**'
      - '.storybook/**'
      - 'vitest.config.ts'
      # Storybook's builder loads the root Vite config (plugins, aliases, define)
      - 'vite.config.ts'
      - 'scripts/vite-service-worker.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/storybook-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth: packageManager in package.json
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The dev server and test-storybook never run a production bundle, so
      # a broken static build only shows up here.
      - name: Build static Storybook
        timeout-minutes: 10
        run: bun run build-storybook --quiet

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Start Storybook and run tests
        timeout-minutes: 10
        run: bunx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
          "bun storybook --ci --quiet" \
          "bunx wait-on http://localhost:6006/iframe.html && bun test-storybook"