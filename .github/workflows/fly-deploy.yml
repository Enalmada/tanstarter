# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.119 # an action input, so Dependabot does not bump it: update by hand
      - name: Deploy to Fly.io
        run: |
          # Try deployment up to 3 times to handle temporary API issues. A retry re-runs
          # fly.toml's release_command (the migrations), which is a no-op once applied.
          for i in 1 2 3; do
            echo "Deployment attempt $i of 3"
            if flyctl deploy --app tanstarter --remote-only --build-arg APT_UPGRADE_CACHE_BUST="$GITHUB_RUN_ID"; then
              echo "Deployment successful!"
              exit 0
            fi
            echo "Deployment attempt $i failed, waiting 10 seconds before retry..."
            sleep 10
          done
          echo "All deployment attempts failed"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
